<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚀 Live Demo | VibeCode TY Demo</title>
    <meta name="description" content="Live demo space — build something new together in real time.">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
</head>

<body>

    <nav class="nav">
        <a href="index.html" class="nav-logo">⚡ VibeCode</a>
        <button class="nav-toggle" id="nav-toggle" aria-label="Toggle navigation">
            <span></span><span></span><span></span>
        </button>
        <ul class="nav-links" id="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="game.html">🎮 Game</a></li>
            <li><a href="music.html">🎵 Music</a></li>
            <li><a href="meme.html">😂 Memes</a></li>
            <li><a href="demo.html" class="active">🚀 Live Demo</a></li>
            <li><a href="bank.html">🏦 Banking AI</a></li>
        </ul>
    </nav>

    <main class="page">
        <div class="live-demo-blank">
            <div class="live-demo-icon">🏗️</div>
            <h2>Live Build Space</h2>
            <p>This is where we build something <strong>new</strong> together — right now, live.</p>
            <p class="live-demo-hint">Tell me what to make and watch it appear.</p>
        </div>
    </main>

    <style>
        .live-demo-blank {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 72px);
            text-align: center;
            padding: var(--space-3xl) var(--space-xl);
            gap: var(--space-lg);
        }

        .live-demo-icon {
            font-size: 5rem;
            opacity: 0.3;
            animation: float 3s ease-in-out infinite;
        }

        .live-demo-blank h2 {
            font-size: clamp(2rem, 5vw, 3rem);
            background: linear-gradient(135deg, var(--text-primary), var(--accent-primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .live-demo-blank p {
            color: var(--text-secondary);
            font-size: 1.1rem;
            max-width: 480px;
        }

        .live-demo-hint {
            font-size: 0.9rem !important;
            color: var(--text-muted) !important;
        }
    </style>

    <script>
        const navToggle = document.getElementById('nav-toggle');
        const navLinks = document.getElementById('nav-links');
        navToggle?.addEventListener('click', () => navLinks.classList.toggle('open'));
    </script>

</body>

</html>
